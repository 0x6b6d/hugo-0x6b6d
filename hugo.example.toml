baseURL = "https://example.com/"
languageCode = "en-us"
title = "Example Site"
theme = "0x6b6d-theme"
paginate = 10
enableRobotsTXT = true
enableEmoji = true

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  # noClasses = false means Hugo emits <span class="k"> etc.
  # The theme's syntax.css file provides the default colors.
  # Set "style" to a Chroma style name (e.g. "dracula") to use
  # Hugo's built-in highlighting instead — but then syntax.css
  # won't apply, so pick one or the other.
  noClasses = false
  lineNos = false
  tabWidth = 2

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  description    = "Your Description."
  author         = "Your Name"
  heroEyebrow    = "Personal blog"
  heroTitle      = "example.com"
  heroSubtitle   = "Your Subtitle."
  footerText     = "Built with Hugo · 0x6b6d theme"
  ogImage        = "/og.png"   # optional

  # Section under content/ that the homepage pulls from
  postsSection = "posts"

  # Site logo text shown top-left. Falls back to `title` above if unset.
  logoText       = "blog.example.com"

  # Name shown in the footer copyright line. Falls back to `title` if unset.
  copyrightName  = "example.com"

  # Optional: overrides the "Blog" label on the nav submenu trigger.
  # blogNavLabel = "Blog"

  [params.social]
    github   = "yourusername"
    twitter  = "yourusername"

# Links to your other sites/subdomains, shown in the main nav.
# Add or remove entries freely — no template edits needed.
# `newTab = true` is optional (opens in a new tab).
[[params.externalNav]]
  name = "Home"
  url  = "https://example.com"

[[params.externalNav]]
  name = "GitHub"
  url  = "https://github.com/yourusername"
  newTab = true

[[menu.main]]
  name   = "Home"
  url    = "/"
  weight = 1

[[menu.main]]
  name   = "Posts"
  url    = "/posts/"
  weight = 2

  [params.theme]
  # Core accent
  # Nothing else needs to be set for these to follow along.
  accent         = "#2563eb"
  accentBright   = "#3b82f6"

  # Neutrals
  #leave these out if you're happy with the dark grays;
  # only set them if you want the base palette (not just the accent) to change.
  bg             = "#161619"
  bgRaised       = "#1c1c20"
  text           = "#ffffff"
  textMuted      = "#888888"
  textDim        = "#555555"
  line           = "#2a2a2e"

  # Syntax highlighting
  # independent of "accent" above. Without these,
  # code blocks keep their purple keyword/tag color while the rest of
  # the site goes blue. Set them if you want a fully unified blue theme.
  syntaxKeyword  = "#5b8def"   # keywords, tags, builtins
  syntaxFunction = "#82aaff"   # functions, attributes, decorators (already blue-ish, fine as-is)
  syntaxClass    = "#ffcb6b"   # class names, namespaces — unrelated to purple, leave alone
  syntaxVariable = "#f07178"   # variables — unrelated to purple, leave alone
  syntaxString   = "#c3e88d"   # strings/literals — unrelated to purple, leave alone
  syntaxNumber   = "#f78c6c"   # numbers/constants — unrelated to purple, leave alone
  syntaxOperator = "#89ddff"   # operators/punctuation — unrelated to purple, leave alone
  syntaxComment  = "#637777"   # comments — unrelated to purple, leave alone
  syntaxError    = "#ff5f57"   # errors/exceptions — unrelated to purple, leave alone
